<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRILLS — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --bg:#0c0c0d; --surface:#17171a; --ink:#f3f1ec; --ink-soft:#9a948a;
    --line:#2a2a2d; --gold:#c6a15b; --gold-ink:#0c0c0d;
    --font-display:"Playfair Display", serif; --font-body:"Inter", sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--ink); min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);}
  .wrap{max-width:1100px; margin:0 auto; padding:2rem 1.5rem;}

  /* login screen */
  #loginScreen{display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:1.5rem;}
  #loginScreen h1{font-size:2rem; letter-spacing:0.05em;}
  #loginScreen p{color:var(--ink-soft);}
  .btn{
    padding:0.9rem 2rem; background:var(--gold); color:var(--gold-ink);
    border:1px solid var(--gold); font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; font-size:0.8rem; cursor:pointer; border-radius:2px;
  }
  .btn:hover{background:transparent; color:var(--gold);}
  .btn-outline{background:transparent; color:var(--gold);}
  .btn-outline:hover{background:var(--gold); color:var(--gold-ink);}
  .btn-danger{border-color:#c65b5b; color:#c65b5b; background:transparent;}
  .btn-danger:hover{background:#c65b5b; color:#fff;}

  /* header */
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem;}
  header .wordmark{font-size:1.4rem; letter-spacing:0.1em;}
  header .wordmark span{color:var(--gold);}

  /* product grid */
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:1.25rem;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; overflow:hidden; transition:border-color .2s;}
  .card:hover{border-color:var(--gold);}
  .card img{width:100%; aspect-ratio:4/5; object-fit:cover; background:#000;}
  .card .body{padding:0.9rem;}
  .card .id{font-size:0.7rem; color:var(--gold); letter-spacing:0.05em;}
  .card .name{font-weight:600; margin:0.2rem 0 0.3rem;}
  .card .meta{display:flex; justify-content:space-between; font-size:0.85rem; color:var(--ink-soft);}
  .card .price{color:var(--gold); font-weight:600;}
  .card .actions{display:flex; gap:0.5rem; padding:0 0.9rem 0.9rem;}
  .card .actions button{flex:1; padding:0.5rem; font-size:0.72rem;}

  /* modal / form */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:50; padding:1.5rem;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--line); max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:2rem; border-radius:4px;}
  .modal h2{margin-bottom:1.2rem;}
  .field{margin-bottom:1rem; display:flex; flex-direction:column; gap:0.4rem;}
  .field label{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);}
  .field input, .field textarea, .field select{
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    padding:0.7rem 0.8rem; font-family:inherit; font-size:0.92rem; border-radius:2px;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
  .sizes-row{display:flex; gap:0.5rem; flex-wrap:wrap;}
  .sizes-row input{flex:1; min-width:70px;}
  .modal-actions{display:flex; gap:0.75rem; margin-top:1.5rem;}
  .modal-actions button{flex:1;}
  #imgPreview{width:100%; aspect-ratio:4/5; object-fit:cover; background:#000; border:1px solid var(--line); margin-bottom:0.6rem; display:none;}

  .toast{
    position:fixed; left:50%; bottom:2rem; transform:translate(-50%, 20px);
    background:var(--gold); color:var(--gold-ink); padding:0.8rem 1.4rem;
    font-size:0.85rem; font-weight:600; border-radius:2px; z-index:80;
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .empty{color:var(--ink-soft); text-align:center; padding:3rem 0; grid-column:1/-1;}
  .spinner{color:var(--ink-soft); text-align:center; padding:3rem 0;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <h1>DRILLS <span style="color:var(--gold)">Dashboard</span></h1>
  <p>Please log in to manage products.</p>
  <button class="btn" id="loginBtn">Log in</button>
</div>

<!-- DASHBOARD (hidden until logged in) -->
<div class="wrap" id="dashboard" style="display:none;">
  <header>
    <div class="wordmark">DRILLS <span>Dashboard</span></div>
    <button class="btn btn-outline" id="logoutBtn">Log out</button>
  </header>

  <div class="toolbar">
    <h2 style="font-size:1.3rem;">Products</h2>
    <button class="btn" id="addBtn">+ Add product</button>
  </div>

  <div class="grid" id="productGrid">
    <div class="spinner">Loading products…</div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">Add product</h2>
    <form id="productForm">
      <div class="field">
        <label>Product ID</label>
        <input type="text" id="fId" required placeholder="DR-006">
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="fName" required>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="fCategory">
          <option>Tops</option>
          <option>Footwear</option>
          <option>Bags</option>
        </select>
      </div>
      <div class="field">
        <label>Price (NGN)</label>
        <input type="number" id="fPrice" required min="0">
      </div>
      <div class="field">
        <label>Photo</label>
        <img id="imgPreview">
        <input type="file" id="fImage" accept="image/*">
      </div>
      <div class="field">
        <label>Sizes (comma separated, e.g. M, L, XL)</label>
        <input type="text" id="fSizes" placeholder="M, L, XL">
      </div>
      <div class="field">
        <label>Limited stock note (optional)</label>
        <input type="text" id="fLimited" placeholder="e.g. Only 5 left">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="fDesc" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SETUP — change these two values for each new client site
============================================================ */
const REPO_OWNER  = "Prince-Tech-Agency";
const REPO_NAME   = "DrillsQuest";
const REPO_BRANCH = "main";
const PRODUCTS_PATH = "site/content/products.json";
const IMAGES_PATH   = "site/images/uploads";

/* ============================================================
   STATE
============================================================ */
let currentUser = null;
let products = [];
let productsSha = null; // needed to update the file on GitHub
let editingIndex = null; // null = adding new, number = editing that index
let pendingImageFile = null;
let pendingImagePath = null;

const el = id => document.getElementById(id);
const toastEl = el("toast");
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2800);
}
const money = n => "₦" + Number(n).toLocaleString("en-NG");

/* ============================================================
   GIT GATEWAY HELPERS
   Git Gateway proxies GitHub's Contents API, authenticated
   with the logged-in user's Identity token.
============================================================ */
function apiUrl(path){
  return `/.netlify/git/github/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
}

async function authHeader(){
  const token = await currentUser.jwt();
  return { "Authorization": "Bearer " + token };
}

async function ghGetFile(path){
  const headers = await authHeader();
  const res = await fetch(apiUrl(path) + `?ref=${REPO_BRANCH}`, { headers });
  if (!res.ok) throw new Error("Failed to load " + path);
  const data = await res.json();
  return { content: decodeURIComponent(escape(atob(data.content))), sha: data.sha };
}

async function ghPutFile(path, contentString, sha, message){
  const headers = await authHeader();
  headers["Content-Type"] = "application/json";
  const body = {
    message: message || ("Update " + path),
    content: btoa(unescape(encodeURIComponent(contentString))),
    branch: REPO_BRANCH
  };
  if (sha) body.sha = sha;
  const res = await fetch(apiUrl(path), { method: "PUT", headers, body: JSON.stringify(body) });
  if (!res.ok) throw new Error("Failed to save " + path);
  return res.json();
}

async function ghPutImage(path, file){
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const headers = await authHeader();
  headers["Content-Type"] = "application/json";
  const body = { message: "Upload image " + path, content: base64, branch: REPO_BRANCH };
  const res = await fetch(apiUrl(path), { method: "PUT", headers, body: JSON.stringify(body) });
  if (!res.ok) throw new Error("Failed to upload image");
  return res.json();
}

/* ============================================================
   LOAD + RENDER PRODUCTS
============================================================ */
async function loadProducts(){
  try{
    const { content, sha } = await ghGetFile(PRODUCTS_PATH);
    const data = JSON.parse(content);
    products = (data.products || []).map(p => ({
      ...p,
      sizes: (p.sizes || []).map(s => (typeof s === "string" ? s : s.size))
    }));
    productsSha = sha;
    renderGrid();
  }catch(err){
    console.error(err);
    el("productGrid").innerHTML = `<div class="empty">Couldn't load products. ${err.message}</div>`;
  }
}

function renderGrid(){
  const grid = el("productGrid");
  if (products.length === 0){
    grid.innerHTML = `<div class="empty">No products yet — click "Add product" to create one.</div>`;
    return;
  }
  grid.innerHTML = products.map((p, i) => `
    <div class="card">
      <img src="../${p.image}" alt="${p.name}" onerror="this.style.opacity=0.3">
      <div class="body">
        <div class="id">${p.id}</div>
        <div class="name">${p.name}</div>
        <div class="meta">
          <span>${p.category}</span>
          <span class="price">${money(p.price)}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-outline" data-edit="${i}">Edit</button>
        <button class="btn btn-danger" data-delete="${i}">Delete</button>
      </div>
    </div>
  `).join("");

  grid.querySelectorAll("[data-edit]").forEach(btn =>
    btn.addEventListener("click", () => openForm(Number(btn.dataset.edit))));
  grid.querySelectorAll("[data-delete]").forEach(btn =>
    btn.addEventListener("click", () => deleteProduct(Number(btn.dataset.delete))));
}

/* ============================================================
   ADD / EDIT FORM
============================================================ */
function openForm(index){
  editingIndex = index;
  pendingImageFile = null;
  const form = el("productForm");
  form.reset();
  el("imgPreview").style.display = "none";

  if (index === null){
    el("formTitle").textContent = "Add product";
  }else{
    el("formTitle").textContent = "Edit product";
    const p = products[index];
    el("fId").value = p.id;
    el("fId").disabled = true; // keep IDs stable when editing
    el("fName").value = p.name;
    el("fCategory").value = p.category;
    el("fPrice").value = p.price;
    el("fSizes").value = (p.sizes || []).join(", ");
    el("fLimited").value = p.limited || "";
    el("fDesc").value = p.desc || "";
    if (p.image){
      el("imgPreview").src = "../" + p.image;
      el("imgPreview").style.display = "block";
    }
  }
  if (index === null) el("fId").disabled = false;
  el("formOverlay").classList.add("show");
}

function closeForm(){
  el("formOverlay").classList.remove("show");
  editingIndex = null;
}

el("addBtn").addEventListener("click", () => openForm(null));
el("cancelBtn").addEventListener("click", closeForm);

el("fImage").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = () => {
    el("imgPreview").src = reader.result;
    el("imgPreview").style.display = "block";
  };
  reader.readAsDataURL(file);
});

el("productForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const saveBtn = el("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving…";

  try{
    let imagePath = editingIndex !== null ? products[editingIndex].image : null;

    // upload new image if one was selected
    if (pendingImageFile){
      const safeName = pendingImageFile.name.replace(/[^a-zA-Z0-9.\-_]/g, "-");
      const uniqueName = Date.now() + "-" + safeName;
      const fullPath = `${IMAGES_PATH}/${uniqueName}`;
      await ghPutImage(fullPath, pendingImageFile);
      imagePath = `${IMAGES_PATH}/${uniqueName}`;
    }

    const entry = {
      id: el("fId").value.trim(),
      name: el("fName").value.trim(),
      category: el("fCategory").value,
      price: Number(el("fPrice").value),
      image: imagePath || "",
      sizes: el("fSizes").value.split(",").map(s => s.trim()).filter(Boolean),
      limited: el("fLimited").value.trim(),
      desc: el("fDesc").value.trim()
    };

    if (editingIndex === null){
      products.push(entry);
    }else{
      products[editingIndex] = entry;
    }

    const newContent = JSON.stringify({ products }, null, 2);
    const result = await ghPutFile(PRODUCTS_PATH, newContent, productsSha, "Update products via dashboard");
    productsSha = result.content.sha;

    renderGrid();
    closeForm();
    showToast("Product saved — live in a minute or two.");
  }catch(err){
    console.error(err);
    showToast("Error: " + err.message);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = "Save";
  }
});

/* ============================================================
   DELETE
============================================================ */
async function deleteProduct(index){
  const p = products[index];
  if (!confirm(`Delete "${p.name}"? This can't be undone.`)) return;

  try{
    products.splice(index, 1);
    const newContent = JSON.stringify({ products }, null, 2);
    const result = await ghPutFile(PRODUCTS_PATH, newContent, productsSha, "Delete product via dashboard");
    productsSha = result.content.sha;
    renderGrid();
    showToast("Product deleted.");
  }catch(err){
    console.error(err);
    showToast("Error: " + err.message);
    loadProducts(); // resync in case of failure
  }
}

/* ============================================================
   AUTH — Netlify Identity
============================================================ */
el("loginBtn").addEventListener("click", () => netlifyIdentity.open("login"));
el("logoutBtn").addEventListener("click", () => netlifyIdentity.logout());

netlifyIdentity.on("init", user => {
  if (user){
    currentUser = user;
    showDashboard();
  }
});
netlifyIdentity.on("login", user => {
  currentUser = user;
  netlifyIdentity.close();
  showDashboard();
});
netlifyIdentity.on("logout", () => {
  currentUser = null;
  el("dashboard").style.display = "none";
  el("loginScreen").style.display = "flex";
});

function showDashboard(){
  el("loginScreen").style.display = "none";
  el("dashboard").style.display = "block";
  loadProducts();
}

netlifyIdentity.init();
</script>
</body>
</html>
